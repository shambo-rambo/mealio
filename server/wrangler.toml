name = "mealio-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"
compatibility_flags = ["nodejs_compat"]

[[d1_databases]]
binding = "DB"
database_name = "mealio"
database_id = "e0dec412-0471-46cd-bc86-b9b7070d6924"
migrations_dir = "src/db/migrations"

[[r2_buckets]]
binding = "R2"
bucket_name = "mealio-uploads"

[durable_objects]
bindings = [{ name = "FAMILY_ROOM", class_name = "FamilyRoom" }]

[[migrations]]
tag = "v1"
new_classes = ["FamilyRoom"]

[vars]
APP_URL = "https://mealio.pages.dev"
GOOGLE_CLIENT_ID = "489348911811-hp2415anm02l93t6s6sanikrslssc1h4.apps.googleusercontent.com"
EMAIL_FROM = "Food Prep <hello@simonhamblin.com>"
# RESEND_API_KEY is set as a secret
# YOUTUBE_API_KEY is set as a secret — see server/.dev.vars for local dev
# INSTAGRAM_TOKEN is set as a secret — format: "{APP_ID}|{APP_SECRET}" from a Meta app with instagram_oembed permission
